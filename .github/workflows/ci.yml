name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage

      - name: Run ChaosHarness Self-Test
        run: |
          python -m chaosharness selftest

      - name: Run Offline Replay Demo
        run: |
          python -m chaosharness run --model gemma4:e2b --quick --seed 42 --cache replay --cache-dir ./demo_cache

      - name: Run Route Lookup
        run: |
          python -m chaosharness route --manifest out/gemma4_e2b/routing_manifest.json --task code

      - name: Run Test Suite with Coverage
        run: |
          python -m coverage run --source=chaosharness -m pytest -v
          python -m coverage report

      - name: Build Wheel Package
        run: |
          python -m pip wheel --no-deps -w dist .
